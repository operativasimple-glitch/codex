<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Colchón</title>
<meta name="theme-color" content="#F5FAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Colchón">
<meta name="description" content="Controla el drawdown y el riesgo restante de todas tus cuentas de prop firm desde una sola pantalla.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F5FAF7;
  --bg-tint:#E7F3EC;
  --card:#FFFFFF;
  --card-soft:#F1F8F4;
  --label:#122019;
  --label2:#5C6F66;
  --label3:#9DB0A6;
  --hairline:rgba(30,70,55,.12);
  --fill:rgba(31,142,110,.10);
  --fill2:rgba(31,142,110,.18);
  --shadow:0 4px 18px rgba(20,60,45,.08);
  --shadow-lift:0 14px 34px -12px rgba(20,60,45,.35);

  --green:#1F8E6E;
  --green-soft:#3FBE93;
  --amber:#C9861A;
  --amber-soft:#E0A430;
  --red:#D6473F;
  --red-soft:#EA6B62;
  --gold:#B4841F;
  --blue:#2E6FB0;
  --accent:#1F8E6E;

  --grad-hero:linear-gradient(145deg,#0B3B33 0%,#12564B 46%,#1D8A6E 100%);
  --grad-accent:linear-gradient(135deg,#1F8E6E 0%,#3FBE93 100%);
  --grad-danger:linear-gradient(135deg,#D6473F 0%,#EA6B62 100%);

  --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;

  --r-lg:24px;
  --r-md:18px;
  --r-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A1512;
    --bg-tint:#0F241C;
    --card:#132720;
    --card-soft:#183129;
    --label:#EFF7F2;
    --label2:#93A99E;
    --label3:#5B7268;
    --hairline:rgba(160,220,195,.10);
    --fill:rgba(63,190,147,.10);
    --fill2:rgba(63,190,147,.18);
    --shadow:0 4px 18px rgba(0,0,0,.45);
    --shadow-lift:0 14px 34px -12px rgba(0,0,0,.65);

    --green:#3FE0A5;
    --green-soft:#7CF0C4;
    --amber:#F4C453;
    --amber-soft:#FFD97A;
    --red:#FF7A72;
    --red-soft:#FFA39C;
    --gold:#F4C453;
    --blue:#7FB1E8;
    --accent:#3FE0A5;

    --grad-hero:linear-gradient(145deg,#07211B 0%,#0F3D32 48%,#1B7A5F 100%);
    --grad-accent:linear-gradient(135deg,#1F8E6E 0%,#3FE0A5 100%);
    --grad-danger:linear-gradient(135deg,#B23A34 0%,#FF7A72 100%);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--label);
  background:
    radial-gradient(900px 460px at 10% -8%, var(--bg-tint), transparent 62%),
    radial-gradient(700px 420px at 108% 4%, rgba(63,190,147,.14), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  font:16.5px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(90px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit}

/* ---- nav bar ---- */
.navbar{
  display:flex;align-items:center;justify-content:space-between;height:46px;
  padding-top:env(safe-area-inset-top);
}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:0;background:var(--grad-accent);color:#06231A;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  box-shadow:0 8px 18px -8px var(--accent);
}
.icon-btn:active{transform:scale(.93);opacity:.9}
.icon-btn svg{width:17px;height:17px}

.large-title{padding:6px 2px 6px}
.large-title h1{
  margin:0;font-family:var(--serif);font-size:36px;font-weight:600;letter-spacing:-.4px;line-height:1.05;
}
.large-title p{margin:6px 0 0;color:var(--label2);font-size:14.5px;max-width:34ch}

/* ---- summary strip ---- */
.summary{
  display:flex;gap:10px;margin:16px 0 20px;
}
.summary .stat{
  flex:1;background:var(--card);border-radius:var(--r-md);padding:12px 12px 11px;box-shadow:var(--shadow);
  border:1px solid var(--hairline);
}
.summary .stat b{display:block;font-size:20px;letter-spacing:-.3px;font-family:var(--mono)}
.summary .stat span{display:block;font-size:11.5px;color:var(--label2);margin-top:2px}
.summary .stat.warn b{color:var(--amber)}
.summary .stat.danger b{color:var(--red)}
.summary .stat.ok b{color:var(--green)}

/* ---- empty state ---- */
.empty{
  text-align:center;padding:56px 20px 30px;color:var(--label2);
}
.empty .emoji{font-size:44px;margin-bottom:14px}
.empty h2{margin:0 0 8px;font-family:var(--serif);font-size:22px;color:var(--label)}
.empty p{margin:0 auto 20px;max-width:32ch;font-size:14.5px}

/* ---- account cards ---- */
.list{display:flex;flex-direction:column;gap:14px}
.acc-card{
  background:var(--card);border-radius:var(--r-lg);padding:16px 16px 14px;
  box-shadow:var(--shadow);border:1px solid var(--hairline);cursor:pointer;
}
.acc-card:active{transform:scale(.99)}
.acc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.acc-id .firm{font-size:11.5px;color:var(--label2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.acc-id .label{font-family:var(--serif);font-size:19px;margin-top:1px}
.pill{
  flex-shrink:0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;letter-spacing:.02em;
  white-space:nowrap;
}
.pill-eval{background:var(--fill2);color:var(--blue)}
.pill-funded{background:rgba(63,190,147,.16);color:var(--green)}
.pill-passed{background:rgba(244,196,83,.18);color:var(--amber)}
.pill-breached{background:rgba(255,122,114,.18);color:var(--red)}

.buffer-row{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.buffer-row .num{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.5px}
.buffer-row .lbl{font-size:12.5px;color:var(--label2)}
.num.ok{color:var(--green)}
.num.warn{color:var(--amber)}
.num.danger{color:var(--red)}

.bar-track{
  height:8px;border-radius:100px;background:var(--fill);margin-top:10px;overflow:hidden;position:relative;
}
.bar-fill{height:100%;border-radius:100px;transition:width .3s}
.bar-fill.ok{background:linear-gradient(90deg,var(--green),var(--green-soft))}
.bar-fill.warn{background:linear-gradient(90deg,var(--amber),var(--amber-soft))}
.bar-fill.danger{background:linear-gradient(90deg,var(--red),var(--red-soft))}

.acc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{
  font-size:11.5px;padding:5px 10px;border-radius:100px;background:var(--card-soft);color:var(--label2);
  border:1px solid var(--hairline);display:flex;align-items:center;gap:4px;
}
.chip.ok{color:var(--green)}
.chip.warn{color:var(--amber)}
.chip.danger{color:var(--red)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

.acc-actions{display:flex;gap:8px;margin-top:12px}
.btn-mini{
  flex:1;border:1px solid var(--hairline);background:var(--card-soft);color:var(--label);
  border-radius:100px;padding:9px 10px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;
}
.btn-mini:active{opacity:.7}
.btn-mini.primary{background:var(--grad-accent);color:#06231A;border:0}

/* ---- FAB ---- */
.fab{
  position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;border:0;background:var(--grad-accent);color:#06231A;
  box-shadow:0 14px 30px -8px var(--accent);display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:20;
}
.fab:active{transform:scale(.94)}
.fab svg{width:24px;height:24px}

/* ---- sheet / modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(6,15,11,.5);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  background:var(--bg);border-radius:26px 26px 0 0;padding:14px 18px calc(28px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lift);
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:5px;border-radius:100px;background:var(--hairline);margin:2px auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{margin:0;font-family:var(--serif);font-size:22px}
.sheet-close{
  width:30px;height:30px;border-radius:50%;border:0;background:var(--card-soft);color:var(--label2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ---- form ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--label2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--label3);margin-top:5px;line-height:1.35}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;border:1px solid var(--hairline);background:var(--card);color:var(--label);
  border-radius:var(--r-sm);padding:11px 12px;font-size:15.5px;outline:none;
}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check-row{display:flex;align-items:center;gap:10px;padding:2px 0}
.check-row input{width:18px;height:18px;accent-color:var(--accent)}
.check-row label{font-size:14px;color:var(--label);margin:0}
fieldset{border:0;padding:0;margin:0 0 6px}
.section-title{
  font-size:11.5px;font-weight:700;color:var(--label3);text-transform:uppercase;letter-spacing:.07em;
  margin:18px 0 10px;
}
.section-title:first-child{margin-top:0}

.btn{
  width:100%;border:0;border-radius:100px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;
  background:var(--grad-accent);color:#06231A;margin-top:6px;
}
.btn:active{opacity:.85}
.btn.secondary{background:var(--card-soft);color:var(--label);border:1px solid var(--hairline)}
.btn.danger{background:var(--grad-danger);color:#2B0906}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:0}

/* ---- detail sheet ---- */
.detail-hero{
  background:var(--grad-hero);border-radius:var(--r-lg);padding:20px;color:#EAF7F0;margin-bottom:16px;
}
.detail-hero .firm{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.75}
.detail-hero .label{font-family:var(--serif);font-size:22px;margin-top:2px}
.detail-hero .buffer{font-family:var(--mono);font-size:38px;font-weight:700;margin-top:14px;letter-spacing:-.5px}
.detail-hero .buffer-lbl{font-size:12px;opacity:.75;margin-top:-2px}
.detail-hero .bar-track{background:rgba(255,255,255,.16);margin-top:14px}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px}
.stat-box .k{font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.05em}
.stat-box .v{font-family:var(--mono);font-size:18px;margin-top:4px;font-weight:600}

.rule-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

.quick-entry{
  background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-md);padding:14px;margin-bottom:16px;
}
.quick-entry h3{margin:0 0 10px;font-size:14.5px;font-weight:700}
.quick-entry .row2{align-items:end}

.history{margin-top:6px}
.history-row{
  display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--hairline);
  font-size:14px;
}
.history-row:last-child{border-bottom:0}
.history-row .d{color:var(--label2);font-size:12.5px}
.history-row .b{font-family:var(--mono);font-weight:600}
.history-row .g{font-family:var(--mono);font-size:12.5px;margin-left:8px}
.history-row .g.pos{color:var(--green)}
.history-row .g.neg{color:var(--red)}
.history-row .del{background:none;border:0;color:var(--label3);cursor:pointer;padding:4px 6px;font-size:14px}
.history-empty{color:var(--label3);font-size:13px;padding:10px 2px}

.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--label);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.disclaimer{
  font-size:11.5px;color:var(--label3);text-align:center;margin:26px 0 6px;line-height:1.5;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar">
    <div></div>
    <button class="icon-btn" id="btnHelp" title="Cómo funciona">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 4"/><path d="M12 17h.01"/></svg>
    </button>
  </div>

  <div class="large-title">
    <h1>Colchón</h1>
    <p>El riesgo restante de todas tus cuentas prop, en una sola pantalla. Actualiza el saldo de cierre cada día.</p>
  </div>

  <div class="summary" id="summary"></div>

  <div id="listArea"></div>

  <div class="disclaimer">Las reglas de cada firma cambian con el tiempo — revisa siempre los números con tu firma. Esta app no sustituye tu panel oficial.</div>
</div>

<button class="fab" id="btnAdd" title="Añadir cuenta">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage & model ---------------- */
const STORAGE_KEY = 'colchon:accounts:v1';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);

function loadAccounts(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e){ return []; }
}
function saveAccounts(accs){ localStorage.setItem(STORAGE_KEY, JSON.stringify(accs)); }

let accounts = loadAccounts();

const FIRMS = [
  { key:'apex', label:'Apex Trader Funding', note:'Suele usar trailing por cierre del día (EOD) que se congela al llegar al balance inicial, y regla de consistencia para el primer payout. Verifica el % y el importe exacto en tu plan.' },
  { key:'topstep', label:'Topstep', note:'Trailing EOD con umbral de congelación. Confirma días mínimos y ventana de payout en tu panel.' },
  { key:'bulenox', label:'Bulenox', note:'Revisa si tu plan usa trailing EOD o intradía — cambia según la promoción.' },
  { key:'myfundedfutures', label:'MyFundedFutures', note:'Confirma el tipo de drawdown y la regla de consistencia de tu plan concreto.' },
  { key:'takeprofittrader', label:'Take Profit Trader', note:'Suele ofrecer variantes con y sin trailing — revisa cuál elegiste.' },
  { key:'tradeify', label:'Tradeify', note:'Verifica el importe del trailing y si se congela al balance inicial.' },
  { key:'tradeday', label:'TradeDay', note:'Confirma días mínimos y regla de consistencia vigentes.' },
  { key:'otra', label:'Otra / personalizada', note:'Introduce las reglas manualmente desde el reglamento de tu firma.' },
];

function firmInfo(key){ return FIRMS.find(f=>f.key===key) || FIRMS[FIRMS.length-1]; }

/* ---------------- computed stats ---------------- */
function sortedEntries(acc){
  return [...acc.entries].sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function currentBalance(acc){
  const es = sortedEntries(acc);
  return es.length ? es[es.length-1].balance : acc.size;
}
function highWaterMark(acc){
  const es = sortedEntries(acc);
  return es.reduce((m,e)=> Math.max(m, e.balance), acc.size);
}
function drawdownFloor(acc){
  if(acc.drawdownType === 'ninguno') return null;
  if(acc.drawdownType === 'estatico') return acc.staticFloor;
  const hwm = highWaterMark(acc);
  let floor = hwm - (acc.trailingAmount || 0);
  if(acc.trailingCap) floor = Math.min(floor, acc.size);
  return floor;
}
function totalAllowance(acc){
  if(acc.drawdownType === 'ninguno') return null;
  if(acc.drawdownType === 'estatico') return acc.size - acc.staticFloor;
  return acc.trailingAmount || 0;
}
function daysTraded(acc){ return sortedEntries(acc).length; }
function dayGains(acc){
  const es = sortedEntries(acc);
  const gains = [];
  let prev = acc.size;
  for(const e of es){ gains.push({ date:e.date, gain: e.balance - prev }); prev = e.balance; }
  return gains;
}
function bestDayGain(acc){
  const gains = dayGains(acc).map(g=>g.gain);
  return gains.length ? Math.max(0, ...gains) : 0;
}
function totalProfit(acc){ return currentBalance(acc) - acc.size; }
function consistencyPctUsed(acc){
  const tp = totalProfit(acc);
  if(tp <= 0) return 0;
  return (bestDayGain(acc) / tp) * 100;
}
function computeAccount(acc){
  const balance = currentBalance(acc);
  const floor = drawdownFloor(acc);
  const allowance = totalAllowance(acc);
  const distance = floor==null ? null : balance - floor;
  const breached = floor!=null && distance <= 0;
  const riskFrac = (floor==null || !allowance) ? 1 : Math.max(0, Math.min(1, distance / allowance));
  let risk = 'ok';
  if(floor!=null){ if(breached || riskFrac < 0.2) risk = 'danger'; else if(riskFrac < 0.5) risk = 'warn'; }
  const days = daysTraded(acc);
  const minDaysMet = !acc.minTradingDays || days >= acc.minTradingDays;
  const tp = totalProfit(acc);
  const consPct = consistencyPctUsed(acc);
  const consOk = !acc.consistencyPct || tp <= 0 || consPct <= acc.consistencyPct;
  const target = acc.profitTarget || 0;
  const targetMet = acc.status === 'evaluacion' && target > 0 && tp >= target && minDaysMet;
  let payoutState = null;
  if(acc.status === 'fondeada' && acc.payoutDate){
    const days2 = Math.ceil((new Date(acc.payoutDate) - new Date(todayISO())) / 86400000);
    payoutState = days2 <= 0 ? { available:true, days:0 } : { available:false, days:days2 };
  }
  let badge = 'eval';
  if(breached) badge = 'breached';
  else if(targetMet) badge = 'passed';
  else if(acc.status === 'fondeada') badge = 'funded';
  return { balance, floor, allowance, distance, breached, risk, riskFrac, days, minDaysMet, totalProfit:tp, consPct, consOk, targetMet, payoutState, badge };
}

/* ---------------- formatting ---------------- */
function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.round(Math.abs(n)).toLocaleString('es-ES');
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ---------------- render: summary ---------------- */
function renderSummary(){
  const box = $('#summary');
  box.innerHTML = '';
  if(!accounts.length){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const cs = accounts.map(computeAccount);
  const atRisk = cs.filter(c => c.risk === 'danger' && !c.breached).length;
  const breached = cs.filter(c => c.breached).length;
  const payoutsReady = cs.filter(c => c.payoutState && c.payoutState.available).length;

  const stats = [
    { v: accounts.length, l: 'cuentas', cls:'' },
    { v: breached, l: breached===1 ? 'quemada' : 'quemadas', cls: breached ? 'danger' : '' },
    { v: atRisk, l: 'en riesgo', cls: atRisk ? 'warn' : 'ok' },
    { v: payoutsReady, l: payoutsReady===1 ? 'payout listo' : 'payouts listos', cls: payoutsReady ? 'ok' : '' },
  ];
  for(const s of stats){
    const d = el('div', 'stat ' + s.cls);
    d.innerHTML = `<b>${s.v}</b><span>${s.l}</span>`;
    box.appendChild(d);
  }
}

/* ---------------- render: list ---------------- */
function renderList(){
  const area = $('#listArea');
  area.innerHTML = '';
  if(!accounts.length){
    area.appendChild(emptyState());
    return;
  }
  const list = el('div', 'list');
  for(const acc of accounts){
    list.appendChild(accountCard(acc));
  }
  area.appendChild(list);
}

function emptyState(){
  const e = el('div', 'empty');
  e.innerHTML = `
    <div class="emoji">🛟</div>
    <h2>Todavía no hay cuentas</h2>
    <p>Añade tu primera cuenta de prop firm y registra el saldo de cierre cada día para ver tu colchón de riesgo en tiempo real.</p>
  `;
  const btn = el('button', 'btn', 'Añadir cuenta');
  btn.style.maxWidth = '240px';
  btn.style.margin = '0 auto';
  btn.onclick = () => openAccountForm();
  e.appendChild(btn);
  return e;
}

function badgeMeta(badge){
  return {
    eval: { cls:'pill-eval', txt:'Evaluación' },
    funded: { cls:'pill-funded', txt:'Fondeada' },
    passed: { cls:'pill-passed', txt:'Objetivo OK' },
    breached: { cls:'pill-breached', txt:'Quemada' },
  }[badge];
}

function accountCard(acc){
  const c = computeAccount(acc);
  const card = el('div', 'acc-card');
  const bm = badgeMeta(c.badge);
  const numCls = c.floor==null ? 'ok' : c.risk;
  const bufferTxt = c.floor==null ? 'sin límite de drawdown' : fmtMoney(c.distance) + (c.breached ? ' (superado)' : '');

  card.innerHTML = `
    <div class="acc-top">
      <div class="acc-id">
        <div class="firm">${firmInfo(acc.firm).label}</div>
        <div class="label">${escapeHtml(acc.label)}</div>
      </div>
      <span class="pill ${bm.cls}">${bm.txt}</span>
    </div>
    <div class="buffer-row">
      <span class="num ${numCls}">${bufferTxt}</span>
      ${c.floor!=null ? '<span class="lbl">colchón restante</span>' : ''}
    </div>
    ${c.floor!=null ? `<div class="bar-track"><div class="bar-fill ${c.risk}" style="width:${Math.round(c.riskFrac*100)}%"></div></div>` : ''}
    <div class="acc-meta"></div>
    <div class="acc-actions">
      <button class="btn-mini primary" data-act="entry">Registrar cierre</button>
      <button class="btn-mini" data-act="open">Ver detalle</button>
    </div>
  `;

  const meta = card.querySelector('.acc-meta');
  meta.appendChild(chip(`Saldo ${fmtMoney(c.balance)}`, ''));
  if(acc.minTradingDays > 0){
    meta.appendChild(chip(`Días ${c.days}/${acc.minTradingDays}`, c.minDaysMet ? 'ok' : 'warn'));
  }
  if(acc.consistencyPct){
    meta.appendChild(chip(`Consistencia ${Math.round(c.consPct)}%/${acc.consistencyPct}%`, c.consOk ? 'ok' : 'danger'));
  }
  if(acc.status === 'evaluacion' && acc.profitTarget){
    const rem = acc.profitTarget - c.totalProfit;
    meta.appendChild(chip(c.targetMet ? 'Objetivo alcanzado' : `Faltan ${fmtMoney(Math.max(0,rem))} para objetivo`, c.targetMet ? 'ok' : ''));
  }
  if(c.payoutState){
    meta.appendChild(chip(c.payoutState.available ? 'Payout disponible' : `Payout en ${c.payoutState.days} d.`, c.payoutState.available ? 'ok' : ''));
  }

  card.querySelector('[data-act="open"]').onclick = (ev) => { ev.stopPropagation(); openDetail(acc.id); };
  card.querySelector('[data-act="entry"]').onclick = (ev) => { ev.stopPropagation(); openQuickEntry(acc.id); };
  card.onclick = () => openDetail(acc.id);
  return card;
}

function chip(txt, cls){
  const c = el('span', 'chip ' + (cls||''));
  c.innerHTML = `<span class="dot"></span>${txt}`;
  return c;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- modal helpers ---------------- */
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function openModal(innerHtml, onMount){
  const root = $('#modalRoot');
  const overlay = el('div', 'overlay');
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  const sheet = el('div', 'sheet');
  sheet.innerHTML = `<div class="sheet-handle"></div>` + innerHtml;
  overlay.appendChild(sheet);
  root.innerHTML = '';
  root.appendChild(overlay);
  if(onMount) onMount(sheet);
}

/* ---------------- account form (add/edit) ---------------- */
function openAccountForm(existing){
  const isEdit = !!existing;
  const acc = existing || {
    id: uid(), label:'', firm:'apex', size:150000, status:'evaluacion',
    drawdownType:'trailing_eod', trailingAmount:0, trailingCap:true, staticFloor:0,
    dailyLossLimit:null, minTradingDays:0, consistencyPct:null, profitTarget:0,
    payoutDate:'', notes:'', entries:[],
  };

  const firmOptions = FIRMS.map(f => `<option value="${f.key}" ${f.key===acc.firm?'selected':''}>${f.label}</option>`).join('');

  const html = `
    <div class="sheet-head">
      <h2>${isEdit ? 'Editar cuenta' : 'Nueva cuenta'}</h2>
      <button class="sheet-close" data-close>&times;</button>
    </div>
    <form id="accForm">
      <div class="section-title">Cuenta</div>
      <div class="field">
        <label>Nombre de la cuenta</label>
        <input type="text" name="label" placeholder="Apex 100k #1" value="${escapeHtml(acc.label)}" required>
      </div>
      <div class="row2">
        <div class="field">
          <label>Firma</label>
          <select name="firm">${firmOptions}</select>
        </div>
        <div class="field">
          <label>Tamaño ($)</label>
          <input type="number" name="size" min="0" step="1" value="${acc.size}" required>
        </div>
      </div>
      <div class="field">
        <label>Estado</label>
        <select name="status">
          <option value="evaluacion" ${acc.status==='evaluacion'?'selected':''}>Evaluación</option>
          <option value="fondeada" ${acc.status==='fondeada'?'selected':''}>Fondeada</option>
        </select>
      </div>
      <div class="field hint" id="firmNote" style="margin-top:-6px"></div>

      <div class="section-title">Drawdown</div>
      <div class="field">
        <label>Tipo de drawdown</label>
        <select name="drawdownType">
          <option value="trailing_eod" ${acc.drawdownType==='trailing_eod'?'selected':''}>Trailing (cierre del día)</option>
          <option value="trailing_intradia" ${acc.drawdownType==='trailing_intradia'?'selected':''}>Trailing (intradía)</option>
          <option value="estatico" ${acc.drawdownType==='estatico'?'selected':''}>Estático</option>
          <option value="ninguno" ${acc.drawdownType==='ninguno'?'selected':''}>Ninguno</option>
        </select>
        <div class="hint" id="ddHint"></div>
      </div>
      <div class="row2" id="ddFields"></div>
      <div class="check-row" id="capRow">
        <input type="checkbox" name="trailingCap" id="capCheck" ${acc.trailingCap?'checked':''}>
        <label for="capCheck">El trailing se congela al llegar al balance inicial</label>
      </div>

      <div class="section-title">Reglas</div>
      <div class="row2">
        <div class="field">
          <label>Días mínimos de trading</label>
          <input type="number" name="minTradingDays" min="0" step="1" value="${acc.minTradingDays||0}">
        </div>
        <div class="field">
          <label>Consistencia (% máx. 1 día)</label>
          <input type="number" name="consistencyPct" min="0" max="100" step="1" value="${acc.consistencyPct||''}" placeholder="p. ej. 30">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Pérdida diaria máx. ($, opcional)</label>
          <input type="number" name="dailyLossLimit" min="0" step="1" value="${acc.dailyLossLimit||''}">
          <div class="hint">Informativa: esta app registra el cierre del día, no el intradía.</div>
        </div>
        <div class="field" id="targetField">
          <label>Objetivo de beneficio ($)</label>
          <input type="number" name="profitTarget" min="0" step="1" value="${acc.profitTarget||''}">
        </div>
      </div>

      <div class="section-title">Payout</div>
      <div class="field">
        <label>Próximo payout disponible</label>
        <input type="date" name="payoutDate" value="${acc.payoutDate||''}">
        <div class="hint">Introduce la fecha que te indica tu firma. Se actualiza a mano tras cada solicitud.</div>
      </div>

      <div class="section-title">Notas</div>
      <div class="field">
        <textarea name="notes" placeholder="Recordatorios, condiciones especiales...">${escapeHtml(acc.notes||'')}</textarea>
      </div>

      <button class="btn" type="submit">${isEdit ? 'Guardar cambios' : 'Añadir cuenta'}</button>
      ${isEdit ? '<button type="button" class="btn danger" id="btnDeleteAcc" style="margin-top:10px">Eliminar cuenta</button>' : ''}
    </form>
  `;

  openModal(html, (sheet) => {
    sheet.querySelector('[data-close]').onclick = closeModal;
    const form = sheet.querySelector('#accForm');
    const firmSel = form.firm;
    const ddSel = form.drawdownType;
    const targetField = sheet.querySelector('#targetField');

    function updateFirmNote(){
      sheet.querySelector('#firmNote').textContent = firmInfo(firmSel.value).note;
    }
    function updateDdFields(){
      const ddFields = sheet.querySelector('#ddFields');
      const capRow = sheet.querySelector('#capRow');
      const ddHint = sheet.querySelector('#ddHint');
      const type = ddSel.value;
      if(type === 'estatico'){
        ddFields.innerHTML = `<div class="field" style="grid-column:1/-1"><label>Suelo fijo ($)</label><input type="number" name="staticFloor" min="0" step="1" value="${acc.staticFloor||0}"></div>`;
        capRow.classList.add('hidden');
        ddHint.textContent = 'El suelo no se mueve con las ganancias.';
      } else if(type === 'ninguno'){
        ddFields.innerHTML = '';
        capRow.classList.add('hidden');
        ddHint.textContent = 'Sin límite de drawdown que vigilar.';
      } else {
        ddFields.innerHTML = `<div class="field" style="grid-column:1/-1"><label>Importe del trailing ($)</label><input type="number" name="trailingAmount" min="0" step="1" value="${acc.trailingAmount||0}"></div>`;
        capRow.classList.remove('hidden');
        ddHint.textContent = type === 'trailing_intradia'
          ? 'Ojo: este trailing usa máximos intradía. Esta app solo ve el cierre del día — el colchón calculado puede ser optimista.'
          : 'El suelo sube con tu balance de cierre más alto, menos el importe del trailing.';
      }
    }
    function updateTargetVisibility(){
      targetField.style.display = form.status.value === 'evaluacion' ? '' : 'none';
    }

    firmSel.onchange = updateFirmNote;
    ddSel.onchange = updateDdFields;
    form.status.onchange = updateTargetVisibility;
    updateFirmNote(); updateDdFields(); updateTargetVisibility();

    if(isEdit){
      sheet.querySelector('#btnDeleteAcc').onclick = () => {
        if(confirm('¿Eliminar esta cuenta y todo su historial?')){
          accounts = accounts.filter(a => a.id !== acc.id);
          saveAccounts(accounts);
          closeModal();
          renderAll();
          toast('Cuenta eliminada');
        }
      };
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const updated = {
        ...acc,
        label: fd.get('label').trim() || 'Cuenta sin nombre',
        firm: fd.get('firm'),
        size: Number(fd.get('size')) || 0,
        status: fd.get('status'),
        drawdownType: fd.get('drawdownType'),
        trailingAmount: Number(fd.get('trailingAmount')) || 0,
        trailingCap: fd.get('trailingCap') === 'on',
        staticFloor: Number(fd.get('staticFloor')) || 0,
        dailyLossLimit: fd.get('dailyLossLimit') ? Number(fd.get('dailyLossLimit')) : null,
        minTradingDays: Number(fd.get('minTradingDays')) || 0,
        consistencyPct: fd.get('consistencyPct') ? Number(fd.get('consistencyPct')) : null,
        profitTarget: Number(fd.get('profitTarget')) || 0,
        payoutDate: fd.get('payoutDate') || '',
        notes: fd.get('notes') || '',
      };
      if(isEdit){
        accounts = accounts.map(a => a.id === acc.id ? updated : a);
      } else {
        accounts.push(updated);
      }
      saveAccounts(accounts);
      closeModal();
      renderAll();
      toast(isEdit ? 'Cambios guardados' : 'Cuenta añadida');
    };
  });
}

/* ---------------- quick entry ---------------- */
function openQuickEntry(accId){
  const acc = accounts.find(a => a.id === accId);
  if(!acc) return;
  const html = `
    <div class="sheet-head">
      <h2>Registrar cierre</h2>
      <button class="sheet-close" data-close>&times;</button>
    </div>
    <div class="field hint" style="margin-top:-6px">${escapeHtml(acc.label)} · saldo actual ${fmtMoney(currentBalance(acc))}</div>
    <form id="entryForm">
      <div class="field">
        <label>Fecha</label>
        <input type="date" name="date" value="${todayISO()}" max="${todayISO()}" required>
      </div>
      <div class="field">
        <label>Saldo de cierre ($)</label>
        <input type="number" name="balance" step="0.01" inputmode="decimal" placeholder="${currentBalance(acc)}" required autofocus>
      </div>
      <button class="btn" type="submit">Guardar</button>
    </form>
  `;
  openModal(html, (sheet) => {
    sheet.querySelector('[data-close]').onclick = closeModal;
    const form = sheet.querySelector('#entryForm');
    form.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const date = fd.get('date');
      const balance = Number(fd.get('balance'));
      acc.entries = acc.entries.filter(en => en.date !== date);
      acc.entries.push({ date, balance });
      saveAccounts(accounts);
      closeModal();
      renderAll();
      toast('Cierre registrado');
    };
  });
}

/* ---------------- detail sheet ---------------- */
function openDetail(accId){
  const acc = accounts.find(a => a.id === accId);
  if(!acc) return;
  const c = computeAccount(acc);
  const bm = badgeMeta(c.badge);

  const html = `
    <div class="sheet-head">
      <h2>Detalle</h2>
      <button class="sheet-close" data-close>&times;</button>
    </div>
    <div class="detail-hero">
      <div class="firm">${firmInfo(acc.firm).label} · <span class="pill ${bm.cls}" style="background:rgba(255,255,255,.18);color:#EAF7F0">${bm.txt}</span></div>
      <div class="label">${escapeHtml(acc.label)}</div>
      <div class="buffer">${c.floor==null ? '—' : fmtMoney(c.distance)}</div>
      <div class="buffer-lbl">${c.floor==null ? 'sin límite de drawdown configurado' : (c.breached ? 'límite superado' : 'colchón restante hasta el suelo')}</div>
      ${c.floor!=null ? `<div class="bar-track"><div class="bar-fill ${c.risk}" style="width:${Math.round(c.riskFrac*100)}%"></div></div>` : ''}
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="k">Saldo actual</div><div class="v">${fmtMoney(c.balance)}</div></div>
      <div class="stat-box"><div class="k">Suelo actual</div><div class="v">${c.floor==null ? '—' : fmtMoney(c.floor)}</div></div>
      <div class="stat-box"><div class="k">Máximo histórico</div><div class="v">${fmtMoney(highWaterMark(acc))}</div></div>
      <div class="stat-box"><div class="k">Beneficio / pérdida</div><div class="v" style="color:${c.totalProfit>=0?'var(--green)':'var(--red)'}">${fmtMoney(c.totalProfit)}</div></div>
    </div>

    <div class="rule-chips" id="ruleChips"></div>

    <div class="quick-entry">
      <h3>Registrar cierre de hoy</h3>
      <form id="detailEntryForm">
        <div class="row2">
          <div class="field" style="margin-bottom:0">
            <label>Fecha</label>
            <input type="date" name="date" value="${todayISO()}" max="${todayISO()}">
          </div>
          <div class="field" style="margin-bottom:0">
            <label>Saldo ($)</label>
            <input type="number" name="balance" step="0.01" inputmode="decimal" placeholder="${c.balance}">
          </div>
        </div>
        <button class="btn" type="submit" style="margin-top:12px">Guardar cierre</button>
      </form>
    </div>

    <div class="section-title">Historial</div>
    <div class="history" id="historyList"></div>

    <div class="btn-row" style="margin-top:20px">
      <button class="btn secondary" id="btnEdit">Editar reglas</button>
      ${acc.status==='evaluacion' ? '<button class="btn" id="btnMarkFunded">Marcar fondeada</button>' : ''}
    </div>
  `;

  openModal(html, (sheet) => {
    sheet.querySelector('[data-close]').onclick = closeModal;

    const chipsBox = sheet.querySelector('#ruleChips');
    if(acc.minTradingDays > 0) chipsBox.appendChild(chip(`Días operados: ${c.days}/${acc.minTradingDays}`, c.minDaysMet ? 'ok' : 'warn'));
    if(acc.consistencyPct) chipsBox.appendChild(chip(`Consistencia: ${Math.round(c.consPct)}% (máx ${acc.consistencyPct}%)`, c.consOk ? 'ok' : 'danger'));
    if(acc.dailyLossLimit) chipsBox.appendChild(chip(`Pérdida diaria máx: ${fmtMoney(acc.dailyLossLimit)}`, ''));
    if(acc.status === 'evaluacion' && acc.profitTarget){
      const rem = acc.profitTarget - c.totalProfit;
      chipsBox.appendChild(chip(c.targetMet ? 'Objetivo de beneficio alcanzado' : `Objetivo: faltan ${fmtMoney(Math.max(0,rem))}`, c.targetMet ? 'ok' : ''));
    }
    if(acc.status === 'fondeada'){
      if(acc.payoutDate){
        chipsBox.appendChild(chip(c.payoutState.available ? 'Payout disponible ahora' : `Payout el ${fmtDate(acc.payoutDate)} (${c.payoutState.days} d.)`, c.payoutState.available ? 'ok' : ''));
      } else {
        chipsBox.appendChild(chip('Sin fecha de payout registrada', ''));
      }
    }
    if(acc.drawdownType === 'trailing_intradia'){
      chipsBox.appendChild(chip('Trailing intradía: verifica el suelo con tu firma', 'warn'));
    }
    if(!chipsBox.children.length){
      chipsBox.appendChild(chip('Sin reglas adicionales configuradas', ''));
    }

    function renderHistory(){
      const box = sheet.querySelector('#historyList');
      const gains = dayGains(acc).reverse();
      box.innerHTML = '';
      if(!gains.length){ box.appendChild(el('div','history-empty','Todavía no has registrado ningún cierre.')); return; }
      for(const g of gains){
        const row = el('div', 'history-row');
        const gcls = g.gain >= 0 ? 'pos' : 'neg';
        const entry = acc.entries.find(en => en.date === g.date);
        row.innerHTML = `
          <span class="d">${fmtDate(g.date)}</span>
          <span><span class="b">${fmtMoney(entry.balance)}</span><span class="g ${gcls}">${g.gain>=0?'+':''}${fmtMoney(g.gain)}</span></span>
          <button class="del" data-date="${g.date}" title="Eliminar">✕</button>
        `;
        row.querySelector('.del').onclick = () => {
          acc.entries = acc.entries.filter(en => en.date !== g.date);
          saveAccounts(accounts);
          renderAll();
          openDetail(accId);
        };
        box.appendChild(row);
      }
    }
    renderHistory();

    sheet.querySelector('#detailEntryForm').onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const date = fd.get('date') || todayISO();
      const balance = Number(fd.get('balance'));
      if(!balance && balance !== 0) return;
      acc.entries = acc.entries.filter(en => en.date !== date);
      acc.entries.push({ date, balance });
      saveAccounts(accounts);
      renderAll();
      toast('Cierre registrado');
      openDetail(accId);
    };

    sheet.querySelector('#btnEdit').onclick = () => { closeModal(); openAccountForm(acc); };
    const btnFunded = sheet.querySelector('#btnMarkFunded');
    if(btnFunded){
      btnFunded.onclick = () => {
        acc.status = 'fondeada';
        saveAccounts(accounts);
        renderAll();
        closeModal();
        toast('Marcada como fondeada');
      };
    }
  });
}

/* ---------------- help ---------------- */
function openHelp(){
  const html = `
    <div class="sheet-head">
      <h2>Cómo funciona</h2>
      <button class="sheet-close" data-close>&times;</button>
    </div>
    <div class="field hint" style="font-size:14px;color:var(--label);line-height:1.6">
      <p><b>1. Añade cada cuenta</b> con su firma, tamaño y reglas de drawdown, días mínimos, consistencia y objetivo.</p>
      <p><b>2. Cada día, registra el saldo de cierre.</b> No hace falta ninguna API: con el cierre basta para calcular el colchón, el historial de días operados y la consistencia.</p>
      <p><b>3. Revisa el colchón restante</b> — la distancia entre tu saldo y el suelo de drawdown — para saber cuánto margen te queda antes de reventar cada cuenta.</p>
      <p>Todo se guarda solo en este dispositivo (sin cuenta, sin servidor). Las reglas de las firmas cambian con frecuencia: verifica siempre los números exactos con tu firma.</p>
    </div>
  `;
  openModal(html, (sheet) => { sheet.querySelector('[data-close]').onclick = closeModal; });
}

/* ---------------- init ---------------- */
function renderAll(){ renderSummary(); renderList(); }
$('#btnAdd').onclick = () => openAccountForm();
$('#btnHelp').onclick = openHelp;
renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
