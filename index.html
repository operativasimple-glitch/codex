<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Goals</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Goals">
<meta name="description" content="Create savings goals and track your progress.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card2:#FFFFFF;
  --sep:rgba(60,60,67,.29);
  --sep-op:rgba(60,60,67,.12);
  --label:#000000;
  --label2:rgba(60,60,67,.6);
  --label3:rgba(60,60,67,.35);
  --fill:rgba(120,120,128,.12);
  --fill2:rgba(120,120,128,.2);

  --blue:#007AFF;
  --green:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --yellow:#FFCC00;
  --pink:#FF2D55;
  --purple:#AF52DE;
  --indigo:#5856D6;
  --teal:#30B0C7;
  --cyan:#32ADE6;
  --brown:#A2845E;
  --mint:#00C7BE;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --card2:#1C1C1E;
    --sep:rgba(84,84,88,.65);
    --sep-op:rgba(84,84,88,.4);
    --label:#FFFFFF;
    --label2:rgba(235,235,245,.6);
    --label3:rgba(235,235,245,.3);
    --fill:rgba(120,120,128,.24);
    --fill2:rgba(120,120,128,.32);

    --blue:#0A84FF;
    --green:#30D158;
    --red:#FF453A;
    --orange:#FF9F0A;
    --yellow:#FFD60A;
    --pink:#FF375F;
    --purple:#BF5AF2;
    --indigo:#5E5CE6;
    --teal:#40C8E0;
    --cyan:#64D2FF;
    --brown:#AC8E68;
    --mint:#63E6E2;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--label);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
button,input{font-family:inherit}

/* ---- nav bar ---- */
.navbar{
  display:flex;align-items:center;justify-content:flex-end;height:44px;
  padding-top:env(safe-area-inset-top);
}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:0;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.icon-btn:active{opacity:.75;transform:scale(.94)}
.icon-btn svg{width:17px;height:17px}

.large-title{padding:2px 2px 18px}
.large-title h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.4px}
.large-title .sub{font-size:15px;color:var(--label2);margin-top:2px;font-weight:500}

/* ---- summary card ---- */
.summary{
  border-radius:var(--r-lg);padding:20px 20px 18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0B3D91 0%,#1560D6 55%,#0A2E70 100%);
  margin-bottom:28px;isolation:isolate;
}
.summary::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(340px 160px at 100% -10%, rgba(255,255,255,.16), transparent 65%);
}
.summary .label{font-size:13px;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.summary .amount{
  font-size:40px;font-weight:800;color:#fff;margin:2px 0 16px;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;
}
.summary .row{display:flex;gap:10px}
.summary .stat{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 6px;text-align:center}
.summary .stat .n{font-weight:700;font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
.summary .stat .l{font-size:11px;color:rgba(255,255,255,.72);margin-top:1px;font-weight:600}

/* ---- section ---- */
.section-title{
  font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--label2);
  margin:0 4px 8px;font-weight:600;
}
.section{margin-bottom:26px}

.empty{
  text-align:center;padding:56px 24px;color:var(--label2);
  background:var(--card);border-radius:var(--r-lg);margin-bottom:26px;
}
.empty .e-icon{
  width:52px;height:52px;border-radius:26px;background:var(--fill);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
}
.empty .e-icon svg{width:24px;height:24px;stroke:var(--label2)}
.empty b{color:var(--label);display:block;margin-bottom:4px;font-size:17px;font-weight:600}
.empty span{font-size:14px}

.list{display:flex;flex-direction:column;gap:12px}

.goal{
  background:var(--card);border-radius:var(--r-lg);
  padding:16px 16px 14px;position:relative;
}
.goal .g-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.g-icon{
  width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.g-icon svg{width:22px;height:22px}
.goal .g-info{flex:1;min-width:0}
.goal .g-name{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.goal .g-date{font-size:13px;color:var(--label2);margin-top:1px}
.goal .g-menu{
  background:var(--fill);border:0;color:var(--label2);width:30px;height:30px;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.goal .g-menu svg{width:15px;height:15px}
.goal .g-menu:active{background:var(--fill2)}

.progress-track{height:7px;border-radius:99px;background:var(--fill);overflow:hidden;margin-bottom:9px}
.progress-fill{height:100%;border-radius:99px;background:var(--blue);transition:width .4s ease}
.goal.done .progress-fill{background:var(--green)}

.g-nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-variant-numeric:tabular-nums}
.g-nums .saved{font-weight:700;font-size:15px;color:var(--blue)}
.goal.done .g-nums .saved{color:var(--green)}
.g-nums .saved .of{color:var(--label2);font-weight:500}
.g-nums .pct{font-size:13px;font-weight:600;color:var(--label2)}

.btn-add-money{
  width:100%;border:0;border-radius:12px;padding:12px;font-weight:600;font-size:15.5px;cursor:pointer;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-add-money:active{opacity:.8}
.btn-add-money:disabled{background:var(--fill);color:var(--label2)}
.done-badge{
  position:absolute;top:14px;right:14px;background:rgba(52,199,89,.15);color:var(--green);
  font-size:12px;font-weight:700;padding:4px 9px 4px 7px;border-radius:99px;
  display:flex;align-items:center;gap:3px;
}
.done-badge svg{width:11px;height:11px}

/* ---- sheet / modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.sheet{
  width:100%;max-width:520px;background:var(--card);
  border-radius:20px 20px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom));
  animation:slideup .25s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto;
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:5px;background:var(--fill2);border-radius:99px;margin:0 auto 4px}

.sheet-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 14px;
}
.sheet-nav .nav-btn{background:transparent;border:0;color:var(--blue);font-size:17px;cursor:pointer;padding:4px}
.sheet-nav .nav-btn.save{font-weight:600}
.sheet-nav .nav-btn:disabled{color:var(--label3)}
.sheet-nav .nav-title{font-size:17px;font-weight:600}

.form-group{
  background:var(--fill);border-radius:var(--r-md);margin:0 16px 20px;overflow:hidden;
}
.form-row{padding:10px 14px;border-bottom:.5px solid var(--sep-op)}
.form-row:last-child{border-bottom:0}
.form-row label{display:block;font-size:12px;color:var(--label2);font-weight:600;margin-bottom:2px;letter-spacing:.2px;text-transform:uppercase}
.form-row input{
  width:100%;background:transparent;border:0;color:var(--label);font-size:17px;
  padding:2px 0;font-family:inherit;
}
.form-row input::placeholder{color:var(--label3)}
.form-row input:focus{outline:0}
.form-row input[type=date]{color-scheme:light dark}

.icon-picker-label{font-size:13px;color:var(--label2);font-weight:600;margin:0 16px 8px;letter-spacing:.2px;text-transform:uppercase}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px 22px}
.icon-opt{
  aspect-ratio:1;border-radius:16px;border:2.5px solid transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-opt svg{width:22px;height:22px}
.icon-opt.sel{border-color:var(--label)}

.quick-amounts{display:flex;gap:8px;padding:0 16px 22px;flex-wrap:wrap}
.qa{
  border:0;background:var(--fill);color:var(--label);border-radius:99px;
  padding:8px 15px;font-size:14.5px;font-weight:600;cursor:pointer;
}
.qa:active{background:var(--blue);color:#fff}

.btn-danger-row{
  width:calc(100% - 32px);margin:4px 16px 0;border:0;background:var(--fill);color:var(--red);border-radius:var(--r-md);
  padding:13px;font-weight:600;font-size:16px;cursor:pointer;
}
.btn-danger-row:active{background:var(--fill2)}

/* ---- personal goals (rules) ---- */
.rules-card{background:var(--card);border-radius:var(--r-lg);overflow:hidden}
.rule{display:flex;align-items:flex-start;gap:11px;padding-left:14px}
.rule-check{
  width:23px;height:23px;border-radius:50%;border:1.8px solid var(--label3);background:transparent;
  padding:0;margin-top:11px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.rule-check svg{width:13px;height:13px;stroke:#fff;opacity:0}
.rule.done .rule-check{background:var(--blue);border-color:var(--blue)}
.rule.done .rule-check svg{opacity:1}
.rule-body{
  flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;
  padding:11px 12px 11px 0;border-bottom:.5px solid var(--sep-op);
}
.rule-text{flex:1;font-size:15.5px;line-height:1.35;padding-top:1px}
.rule.done .rule-text{color:var(--label2)}
.rule-menu{
  background:transparent;border:0;color:var(--label3);width:26px;height:26px;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:-1px;
}
.rule-menu svg{width:15px;height:15px}
.rule-add{
  width:100%;display:flex;align-items:center;gap:11px;padding:13px 14px;text-align:left;
  background:transparent;border:0;color:var(--blue);font-size:16px;cursor:pointer;font-family:inherit;
}
.rule-add svg{width:23px;height:23px;flex-shrink:0}
.rule-add:active{background:var(--fill)}

/* ---- success overlay ---- */
.success-overlay{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;
}
.success-overlay.show{opacity:1}
.success-card{
  background:var(--card);border-radius:22px;padding:30px 36px;text-align:center;
  transform:scale(.85);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.success-overlay.show .success-card{transform:scale(1)}
.success-check{
  width:60px;height:60px;border-radius:50%;background:var(--green);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
}
.success-check svg{width:30px;height:30px;stroke:#fff}
.success-card b{font-size:16px;font-weight:700;display:block}
.success-card span{font-size:13.5px;color:var(--label2);display:block;margin-top:2px}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-14px);
  background:rgba(28,28,30,.92);color:#fff;padding:10px 18px;border-radius:99px;
  font-size:14px;font-weight:600;z-index:90;max-width:88vw;text-align:center;
  opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div class="navbar">
      <button class="icon-btn" id="fabAdd" aria-label="New goal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="large-title">
      <h1>Goals</h1>
      <div class="sub" id="dateLine"></div>
    </div>

    <div class="summary">
      <div class="label">Total Saved</div>
      <div class="amount" id="totalSaved">$0</div>
      <div class="row">
        <div class="stat"><div class="n" id="statGoals">0</div><div class="l">Active</div></div>
        <div class="stat"><div class="n" id="statDone">0</div><div class="l">Completed</div></div>
        <div class="stat"><div class="n" id="statTarget">$0</div><div class="l">Target</div></div>
      </div>
    </div>

    <div id="emptyState" class="empty hidden">
      <div class="e-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5" fill="currentColor"/></svg></div>
      <b>No Goals Yet</b>
      <span>Tap + to create your first savings goal</span>
    </div>

    <div class="section hidden" id="activeSection">
      <div class="section-title">In Progress</div>
      <div class="list" id="activeList"></div>
    </div>

    <div class="section hidden" id="doneSection">
      <div class="section-title">Completed</div>
      <div class="list" id="doneList"></div>
    </div>

    <div class="section">
      <div class="section-title">Personal Goals</div>
      <div class="rules-card">
        <div id="rulesList"></div>
        <button class="rule-add" id="btnAddRule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Add Rule
        </button>
      </div>
    </div>
  </div>
</div>

<!-- New / edit goal sheet -->
<div class="overlay hidden" id="goalOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-nav">
      <button class="nav-btn" id="btnCancelGoal">Cancel</button>
      <div class="nav-title" id="goalSheetTitle">New Goal</div>
      <button class="nav-btn save" id="btnSaveGoal">Save</button>
    </div>

    <div class="form-group">
      <div class="form-row">
        <label>Name</label>
        <input id="inpName" type="text" placeholder="e.g. Beach Trip" maxlength="40">
      </div>
      <div class="form-row">
        <label>Target Amount</label>
        <input id="inpTarget" type="number" inputmode="decimal" placeholder="$0" min="0" step="0.01">
      </div>
      <div class="form-row">
        <label>Due Date (Optional)</label>
        <input id="inpDate" type="date">
      </div>
    </div>

    <div class="icon-picker-label">Icon</div>
    <div class="icon-grid" id="iconGrid"></div>

    <button class="btn-danger-row hidden" id="btnDeleteGoal">Delete Goal</button>
  </div>
</div>

<!-- Add money sheet -->
<div class="overlay hidden" id="moneyOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-nav">
      <button class="nav-btn" id="btnCancelMoney">Cancel</button>
      <div class="nav-title">Add Money</div>
      <button class="nav-btn save" id="btnConfirmMoney">Add</button>
    </div>

    <div class="form-group">
      <div class="form-row">
        <label>Amount</label>
        <input id="inpMoney" type="number" inputmode="decimal" placeholder="$0" min="0" step="0.01">
      </div>
    </div>

    <div class="quick-amounts">
      <button class="qa" data-v="5">+$5</button>
      <button class="qa" data-v="10">+$10</button>
      <button class="qa" data-v="20">+$20</button>
      <button class="qa" data-v="50">+$50</button>
      <button class="qa" data-v="100">+$100</button>
    </div>
  </div>
</div>

<!-- New / edit rule sheet -->
<div class="overlay hidden" id="ruleOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-nav">
      <button class="nav-btn" id="btnCancelRule">Cancel</button>
      <div class="nav-title" id="ruleSheetTitle">New Rule</div>
      <button class="nav-btn save" id="btnSaveRule">Save</button>
    </div>

    <div class="form-group">
      <div class="form-row">
        <label>Rule</label>
        <input id="inpRule" type="text" placeholder="e.g. Spend money only on groceries" maxlength="90">
      </div>
    </div>

    <button class="btn-danger-row hidden" id="btnDeleteRule">Delete Rule</button>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div>
    <b>Goal Complete!</b>
    <span id="successName"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'savingGoals.v2';
const RULES_KEY = 'personalGoals.v1';
const DEFAULT_RULES = [
  'Spend money only on groceries',
  "Don't buy clothes or decorations unless with extra money",
  "Don't spend money in Brazil",
];

/* ---- icon set: id -> {color, svg innerHTML} ---- */
const ICONS = {
  target:  { color:'var(--red)',    svg:'<circle cx="12" cy="12" r="8" stroke="#fff" fill="none"/><circle cx="12" cy="12" r="4.5" stroke="#fff" fill="none"/><circle cx="12" cy="12" r="1.4" fill="#fff"/>' },
  flight:  { color:'var(--blue)',   svg:'<path d="M3 11.5 21 3l-8.5 18-2-8-8-1.5Z" fill="#fff"/>' },
  beach:   { color:'var(--cyan)',   svg:'<path d="M4 15a8 8 0 0 1 16 0H4Z" fill="#fff"/><line x1="12" y1="15" x2="12" y2="21" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>' },
  home:    { color:'var(--orange)', svg:'<path d="M4 11.5 12 4l8 7.5V19a1 1 0 0 1-1 1h-4.2v-6H9.2v6H5a1 1 0 0 1-1-1Z" fill="#fff"/>' },
  car:     { color:'var(--brown)',  svg:'<path d="M4.5 16.5 6 11.4A2 2 0 0 1 7.9 10h8.2a2 2 0 0 1 1.9 1.4l1.5 5.1" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="16" width="18" height="3.2" rx="1.4" fill="#fff"/><circle cx="7.5" cy="19.4" r="1.4" fill="var(--brown)" stroke="#fff" stroke-width="1.4"/><circle cx="16.5" cy="19.4" r="1.4" fill="var(--brown)" stroke="#fff" stroke-width="1.4"/>' },
  ring:    { color:'var(--pink)',   svg:'<circle cx="12" cy="15" r="5.5" stroke="#fff" stroke-width="1.8" fill="none"/><path d="M12 4.5 14.3 8.5h-4.6Z" fill="#fff"/>' },
  cap:     { color:'var(--indigo)', svg:'<path d="M12 4 2.5 9 12 14l9.5-5Z" fill="#fff"/><path d="M6.5 11.3V16c0 1.4 2.5 2.7 5.5 2.7s5.5-1.3 5.5-2.7v-4.7" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>' },
  laptop:  { color:'var(--teal)',   svg:'<rect x="5" y="6" width="14" height="9.5" rx="1.2" stroke="#fff" stroke-width="1.8" fill="none"/><path d="M2.5 18.5h19l-1.4 1.9a1 1 0 0 1-.8.4H4.7a1 1 0 0 1-.8-.4Z" fill="#fff"/>' },
  gift:    { color:'var(--purple)', svg:'<rect x="4" y="10.5" width="16" height="9.5" rx="1.2" fill="#fff"/><rect x="4" y="7" width="16" height="4" rx="1.2" fill="#fff"/><line x1="12" y1="7" x2="12" y2="20" stroke="var(--purple)" stroke-width="1.8"/><circle cx="9" cy="5.2" r="1.9" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="15" cy="5.2" r="1.9" stroke="#fff" stroke-width="1.6" fill="none"/>' },
  camera:  { color:'var(--yellow)', svg:'<rect x="3" y="7.5" width="18" height="12" rx="2" stroke="#fff" stroke-width="1.8" fill="none"/><path d="M8.3 7.5 9.6 5h4.8l1.3 2.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.4" stroke="#fff" stroke-width="1.8" fill="none"/>' },
  paw:     { color:'var(--mint)',   svg:'<ellipse cx="12" cy="15.5" rx="4.2" ry="3.4" fill="#fff"/><circle cx="6.8" cy="9.5" r="2" fill="#fff"/><circle cx="11" cy="6.3" r="2" fill="#fff"/><circle cx="15" cy="6.3" r="2" fill="#fff"/><circle cx="17.2" cy="9.5" r="2" fill="#fff"/>' },
  star:    { color:'var(--green)',  svg:'<path d="M12 3.5 14.6 9.3 21 9.9l-4.8 4.2 1.5 6.2L12 17l-5.7 3.3 1.5-6.2L2 9.9l6.4-.6Z" fill="#fff"/>' },
  bank:    { color:'var(--indigo)', svg:'<rect x="4" y="10" width="16" height="8" rx="1.4" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="12" cy="14" r="2.1" fill="#fff"/><line x1="4" y1="10" x2="4" y2="18" stroke="#fff" stroke-width="0"/><path d="M4 10 12 4l8 6" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
};
const ICON_IDS = Object.keys(ICONS);

let goals = load();
let rules = loadRules();
let activeGoalId = null;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    return JSON.parse(raw);
  }catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){
  n = Math.round((n + Number.EPSILON) * 100) / 100;
  return '$' + n.toLocaleString('en-US', {maximumFractionDigits: n % 1 === 0 ? 0 : 2});
}
function dateLine(){
  const d = new Date();
  document.getElementById('dateLine').textContent = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
}
dateLine();

function daysLeftText(dateStr){
  if(!dateStr) return 'No due date';
  const target = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  const due = 'Due ' + target.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  if(diff < 0) return due + ' · Overdue';
  if(diff === 0) return due + ' · Today';
  if(diff === 1) return due + ' · 1 day left';
  return due + ' · ' + diff + ' days left';
}

function iconFor(id){
  return ICONS[id] ? id : ICON_IDS[0];
}

function goalCard(g){
  const pct = g.target > 0 ? Math.min(100, (g.saved / g.target) * 100) : 0;
  const isDone = g.saved >= g.target && g.target > 0;
  const icon = ICONS[iconFor(g.icon)];
  const el = document.createElement('div');
  el.className = 'goal' + (isDone ? ' done' : '');
  el.innerHTML = `
    ${isDone ? '<div class="done-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>Done</div>' : ''}
    <div class="g-top">
      <div class="g-icon" style="background:${icon.color}">${icon.svg}</div>
      <div class="g-info">
        <div class="g-name">${escapeHtml(g.name)}</div>
        <div class="g-date">${daysLeftText(g.date)}</div>
      </div>
      <button class="g-menu" data-edit="${g.id}" aria-label="Edit">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="g-nums">
      <div class="saved">${fmt(g.saved)} <span class="of">of ${fmt(g.target)}</span></div>
      <div class="pct">${pct.toFixed(0)}%</div>
    </div>
    <button class="btn-add-money" data-add="${g.id}" ${isDone ? 'disabled' : ''}>${isDone ? 'Goal Reached' : 'Add Money'}</button>
  `;
  return el;
}

function render(){
  const activeList = document.getElementById('activeList');
  const doneList = document.getElementById('doneList');
  const activeSection = document.getElementById('activeSection');
  const doneSection = document.getElementById('doneSection');
  const empty = document.getElementById('emptyState');
  activeList.innerHTML = '';
  doneList.innerHTML = '';

  empty.classList.toggle('hidden', goals.length !== 0);

  let totalSaved = 0, totalTarget = 0, doneCount = 0;
  const active = [], done = [];

  goals.forEach(g => {
    totalSaved += g.saved;
    totalTarget += g.target;
    const isDone = g.saved >= g.target && g.target > 0;
    if(isDone){ doneCount++; done.push(g); } else { active.push(g); }
  });

  active.forEach(g => activeList.appendChild(goalCard(g)));
  done.forEach(g => doneList.appendChild(goalCard(g)));

  activeSection.classList.toggle('hidden', active.length === 0);
  doneSection.classList.toggle('hidden', done.length === 0);

  document.getElementById('totalSaved').textContent = fmt(totalSaved);
  document.getElementById('statGoals').textContent = active.length;
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statTarget').textContent = fmt(totalTarget);

  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => openMoneySheet(b.dataset.add)));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openGoalSheet(b.dataset.edit)));
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- goal sheet (create/edit) ---- */
const goalOverlay = document.getElementById('goalOverlay');
const iconGrid = document.getElementById('iconGrid');
let selectedIcon = ICON_IDS[0];

ICON_IDS.forEach(id => {
  const icon = ICONS[id];
  const b = document.createElement('button');
  b.className = 'icon-opt';
  b.type = 'button';
  b.style.background = icon.color;
  b.innerHTML = `<svg viewBox="0 0 24 24">${icon.svg}</svg>`;
  b.addEventListener('click', () => {
    selectedIcon = id;
    iconGrid.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  });
  iconGrid.appendChild(b);
});

function openGoalSheet(id){
  activeGoalId = id || null;
  const g = id ? goals.find(x => x.id === id) : null;
  document.getElementById('goalSheetTitle').textContent = g ? 'Edit Goal' : 'New Goal';
  document.getElementById('inpName').value = g ? g.name : '';
  document.getElementById('inpTarget').value = g ? g.target : '';
  document.getElementById('inpDate').value = g ? (g.date || '') : '';
  selectedIcon = g ? iconFor(g.icon) : ICON_IDS[0];
  iconGrid.querySelectorAll('.icon-opt').forEach((x, i) => x.classList.toggle('sel', ICON_IDS[i] === selectedIcon));
  document.getElementById('btnDeleteGoal').classList.toggle('hidden', !g);
  goalOverlay.classList.remove('hidden');
  setTimeout(() => document.getElementById('inpName').focus(), 50);
}
function closeGoalSheet(){
  goalOverlay.classList.add('hidden');
  activeGoalId = null;
}
document.getElementById('fabAdd').addEventListener('click', () => openGoalSheet(null));
document.getElementById('btnCancelGoal').addEventListener('click', closeGoalSheet);
goalOverlay.addEventListener('click', e => { if(e.target === goalOverlay) closeGoalSheet(); });

document.getElementById('btnSaveGoal').addEventListener('click', () => {
  const name = document.getElementById('inpName').value.trim();
  const target = parseFloat(document.getElementById('inpTarget').value);
  const date = document.getElementById('inpDate').value;

  if(!name){ showToast('Give your goal a name'); return; }
  if(!target || target <= 0){ showToast('Enter a valid target amount'); return; }

  if(activeGoalId){
    const g = goals.find(x => x.id === activeGoalId);
    g.name = name; g.target = target; g.date = date; g.icon = selectedIcon;
  } else {
    goals.push({ id: uid(), name, target, saved: 0, date, icon: selectedIcon, createdAt: Date.now() });
  }
  save(); render(); closeGoalSheet();
  showToast(activeGoalId ? 'Goal updated' : 'Goal created');
});

document.getElementById('btnDeleteGoal').addEventListener('click', () => {
  if(!activeGoalId) return;
  if(confirm('Delete this goal? This cannot be undone.')){
    goals = goals.filter(x => x.id !== activeGoalId);
    save(); render(); closeGoalSheet();
    showToast('Goal deleted');
  }
});

/* ---- add money sheet ---- */
const moneyOverlay = document.getElementById('moneyOverlay');
function openMoneySheet(id){
  activeGoalId = id;
  document.getElementById('inpMoney').value = '';
  moneyOverlay.classList.remove('hidden');
  setTimeout(() => document.getElementById('inpMoney').focus(), 50);
}
function closeMoneySheet(){
  moneyOverlay.classList.add('hidden');
  activeGoalId = null;
}
document.getElementById('btnCancelMoney').addEventListener('click', closeMoneySheet);
moneyOverlay.addEventListener('click', e => { if(e.target === moneyOverlay) closeMoneySheet(); });

document.querySelectorAll('.qa').forEach(b => {
  b.addEventListener('click', () => {
    const inp = document.getElementById('inpMoney');
    inp.value = (parseFloat(inp.value) || 0) + parseFloat(b.dataset.v);
  });
});

document.getElementById('btnConfirmMoney').addEventListener('click', () => {
  const amount = parseFloat(document.getElementById('inpMoney').value);
  if(!amount || amount <= 0){ showToast('Enter a valid amount'); return; }
  const g = goals.find(x => x.id === activeGoalId);
  if(!g) return;
  const wasDone = g.saved >= g.target;
  g.saved += amount;
  save();
  const nowDone = g.saved >= g.target;
  closeMoneySheet();
  render();
  if(nowDone && !wasDone){
    showSuccess(g.name);
  } else {
    showToast(fmt(amount) + ' added to "' + g.name + '"');
  }
});

/* ---- personal goals (rules) ---- */
const ruleOverlay = document.getElementById('ruleOverlay');
let activeRuleId = null;

function loadRules(){
  try{
    const raw = localStorage.getItem(RULES_KEY);
    if(raw === null) return DEFAULT_RULES.map(text => ({ id: uid(), text, done: false }));
    return JSON.parse(raw);
  }catch(e){ return []; }
}
function saveRules(){
  localStorage.setItem(RULES_KEY, JSON.stringify(rules));
}

function renderRules(){
  const list = document.getElementById('rulesList');
  list.innerHTML = '';

  rules.forEach(r => {
    const el = document.createElement('div');
    el.className = 'rule' + (r.done ? ' done' : '');
    el.innerHTML = `
      <button class="rule-check" data-toggle="${r.id}" aria-label="Toggle rule">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>
      </button>
      <div class="rule-body">
        <div class="rule-text">${escapeHtml(r.text)}</div>
        <button class="rule-menu" data-rule-edit="${r.id}" aria-label="Edit rule">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    `;
    list.appendChild(el);
  });

  list.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => toggleRule(b.dataset.toggle)));
  list.querySelectorAll('[data-rule-edit]').forEach(b => b.addEventListener('click', () => openRuleSheet(b.dataset.ruleEdit)));
}

function toggleRule(id){
  const r = rules.find(x => x.id === id);
  if(!r) return;
  r.done = !r.done;
  saveRules();
  renderRules();
}

function openRuleSheet(id){
  activeRuleId = id || null;
  const r = id ? rules.find(x => x.id === id) : null;
  document.getElementById('ruleSheetTitle').textContent = r ? 'Edit Rule' : 'New Rule';
  document.getElementById('inpRule').value = r ? r.text : '';
  document.getElementById('btnDeleteRule').classList.toggle('hidden', !r);
  ruleOverlay.classList.remove('hidden');
  setTimeout(() => document.getElementById('inpRule').focus(), 50);
}
function closeRuleSheet(){
  ruleOverlay.classList.add('hidden');
  activeRuleId = null;
}
document.getElementById('btnAddRule').addEventListener('click', () => openRuleSheet(null));
document.getElementById('btnCancelRule').addEventListener('click', closeRuleSheet);
ruleOverlay.addEventListener('click', e => { if(e.target === ruleOverlay) closeRuleSheet(); });

document.getElementById('btnSaveRule').addEventListener('click', () => {
  const text = document.getElementById('inpRule').value.trim();
  if(!text){ showToast('Write your rule first'); return; }

  const editing = activeRuleId;
  if(editing){
    rules.find(x => x.id === editing).text = text;
  } else {
    rules.push({ id: uid(), text, done: false });
  }
  saveRules(); renderRules(); closeRuleSheet();
  showToast(editing ? 'Rule updated' : 'Rule added');
});

document.getElementById('btnDeleteRule').addEventListener('click', () => {
  if(!activeRuleId) return;
  if(confirm('Delete this rule? This cannot be undone.')){
    rules = rules.filter(x => x.id !== activeRuleId);
    saveRules(); renderRules(); closeRuleSheet();
    showToast('Rule deleted');
  }
});

/* ---- toast ---- */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---- success overlay ---- */
function showSuccess(name){
  const overlay = document.getElementById('successOverlay');
  document.getElementById('successName').textContent = '"' + name + '" is fully funded';
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1500);
}

/* ---- init ---- */
render();
if(localStorage.getItem(RULES_KEY) === null) saveRules();
renderRules();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
