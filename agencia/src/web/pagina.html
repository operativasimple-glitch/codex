<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agencia · cumplimiento digital</title>
<style>
:root{color-scheme:light;--fondo:#f2f2ef;--tarjeta:#fcfcfb;--linea:#e3e3e0;--tinta:#0b0b0b;--suave:#52514e;
--acento:#0b3b2e;--acento-claro:#0f5c47;--serie:#2a78d6;--bien:#0ca30c;--aviso:#b54708;--critico:#d03b3b;--sombra:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--fondo:#111110;--tarjeta:#1a1a19;--linea:#2e2e2c;
--tinta:#fff;--suave:#c3c2b7;--acento:#8fd6bd;--acento-claro:#a7e3ce;--serie:#3987e5;--sombra:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.env{max-width:1080px;margin:0 auto;padding:22px 20px 80px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:17px;margin:0;letter-spacing:.06em;color:var(--acento);font-weight:700}
h1 small{font-weight:400;letter-spacing:0;color:var(--suave);margin-left:8px;font-size:13px}
.reloj{font-size:12.5px;color:var(--suave);text-align:right}

.principal{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.btn{border:1px solid var(--linea);background:var(--tarjeta);color:var(--tinta);
padding:9px 15px;border-radius:9px;box-shadow:var(--sombra);transition:.12s}
.btn:hover:not(:disabled){border-color:var(--acento);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.fuerte{background:var(--acento);color:var(--fondo);border-color:var(--acento);font-weight:600}
@media (prefers-color-scheme:dark){.btn.fuerte{color:#101010}}
.btn.chico{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.peligro:hover{border-color:var(--critico);color:var(--critico)}

#trabajo{background:var(--tarjeta);border:1px solid var(--linea);border-left:3px solid var(--serie);
border-radius:11px;padding:14px 16px;margin-bottom:18px}
#trabajo h3{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--serie);animation:late 1.1s ease-in-out infinite}
@keyframes late{0%,100%{opacity:1}50%{opacity:.25}}
#registro{max-height:230px;overflow-y:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
color:var(--suave);white-space:pre-wrap;word-break:break-word}

nav{display:flex;gap:3px;border-bottom:1px solid var(--linea);margin-bottom:18px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--suave);
padding:9px 13px;white-space:nowrap}
nav button.activa{color:var(--tinta);border-bottom-color:var(--acento);font-weight:600}
nav button .cuenta{background:var(--linea);border-radius:99px;padding:1px 7px;font-size:11px;margin-left:6px}

h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:26px 0 10px;font-weight:600}
h2:first-child{margin-top:0}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ficha{background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;padding:14px 16px;box-shadow:var(--sombra)}
.ficha b{display:block;font-size:25px;letter-spacing:-.03em;line-height:1.15}
.ficha span{font-size:11.5px;color:var(--suave)}

.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:11px;padding:15px 17px;
margin-bottom:9px;box-shadow:var(--sombra)}
.tarjeta.accion{border-left:3px solid var(--acento)}
.fila-tarjeta{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.suave{color:var(--suave)}
.mini{font-size:12px}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.13);padding:2px 6px;border-radius:5px}

table{width:100%;border-collapse:collapse;background:var(--tarjeta);border:1px solid var(--linea);
border-radius:11px;overflow:hidden;box-shadow:var(--sombra)}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);
padding:9px 12px;border-bottom:1px solid var(--linea);font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.acciones{text-align:right;white-space:nowrap}
td.acciones .btn{margin-left:5px}

.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.c-sin-auditar{background:rgba(127,127,127,.16);color:var(--suave)}
.c-auditado{background:#e0eaff;color:#1e40af}
.c-contactado,.c-recordado{background:#fef0c7;color:#93370d}
.c-respondido,.c-llamada{background:#d1fadf;color:#05603a}
.c-cliente{background:var(--acento);color:#fff}
.c-descartado{background:rgba(127,127,127,.12);color:var(--suave);text-decoration:line-through}
@media (prefers-color-scheme:dark){.c-auditado{background:#1e3a8a;color:#dbeafe}.c-contactado,.c-recordado{background:#7c2d12;color:#fed7aa}
.c-respondido,.c-llamada{background:#065f46;color:#d1fae5}.c-cliente{background:var(--acento);color:#101010}}
.punto{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.correo{white-space:pre-wrap;font-size:13px;background:var(--fondo);border:1px solid var(--linea);
border-radius:9px;padding:13px 15px;margin-top:10px;max-height:420px;overflow-y:auto}
select,input[type=text]{font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--linea);
background:var(--tarjeta);color:var(--tinta)}

#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);
background:var(--tinta);color:var(--fondo);padding:11px 18px;border-radius:10px;font-size:13.5px;
max-width:min(600px,90vw);transition:transform .22s;z-index:9}
#aviso.visible{transform:translateX(-50%) translateY(0)}
#aviso.malo{background:var(--critico);color:#fff}
#aviso:empty{display:none}
.vacio{color:var(--suave);padding:20px 0}
</style>
</head>
<body>
<div class="env">

<header>
  <h1 id="marca">AGENCIA<small>cumplimiento digital</small></h1>
  <div class="reloj" id="reloj"></div>
</header>

<div class="principal">
  <button class="btn fuerte" id="btn-arranque">Auditar la cartera entera</button>
  <button class="btn" id="btn-sesion">Hacer la sesión de hoy</button>
  <button class="btn" id="btn-simulacro">Ver qué haría (simulacro)</button>
  <button class="btn" id="btn-sembrar">Cargar los 20 leads</button>
</div>

<div id="trabajo" hidden>
  <h3><span class="pulso"></span><span id="trabajo-titulo"></span></h3>
  <div id="registro"></div>
</div>

<nav id="pestanas">
  <button data-tab="panel" class="activa">Panel</button>
  <button data-tab="leads">Leads<span class="cuenta" id="n-leads">0</span></button>
  <button data-tab="auditorias">Auditorías<span class="cuenta" id="n-escaneos">0</span></button>
  <button data-tab="bandeja">Bandeja<span class="cuenta" id="n-bandeja">0</span></button>
  <button data-tab="bitacora">Bitácora</button>
</nav>

<main>
  <section id="tab-panel"></section>
  <section id="tab-leads" hidden></section>
  <section id="tab-auditorias" hidden></section>
  <section id="tab-bandeja" hidden></section>
  <section id="tab-bitacora" hidden></section>
</main>

</div>
<div id="aviso"></div>

<script>
const $ = (s) => document.querySelector(s);
let estado = null;
let pestana = 'panel';
let abiertos = new Set();   // correos desplegados en la bandeja

const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (m) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

const euros = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n || 0);

function avisar(texto, malo = false) {
  const a = $('#aviso');
  a.textContent = texto;
  a.className = 'visible' + (malo ? ' malo' : '');
  clearTimeout(a._t);
  a._t = setTimeout(() => { a.className = ''; }, malo ? 7000 : 4000);
}

async function pedir(cuerpo) {
  const r = await fetch('/api/accion', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo),
  });
  const datos = await r.json();
  if (!r.ok || datos.error) { avisar(datos.error || 'No ha salido', true); return null; }
  if (datos.mensaje) avisar(datos.mensaje);
  await refrescar();
  return datos;
}

async function refrescar() {
  try {
    const r = await fetch('/api/estado');
    estado = await r.json();
    pintar();
  } catch { avisar('Se ha perdido la conexión con el programa. ¿Sigue abierta la ventana de la terminal?', true); }
}

// ── Pintado

function pintar() {
  if (!estado) return;
  const m = estado.marcador;
  $('#marca').innerHTML = esc(estado.marca.toUpperCase()) + '<small>cumplimiento digital</small>';
  $('#reloj').innerHTML = 'Día ' + m.dias + ' de los 90 · quedan ' + m.restantes
    + '<br>En España son las ' + estado.ventana.horaEspana
    + (estado.ventana.abierta ? ' · <b>se puede llamar</b>' : ' · fuera de la ventana de llamadas');

  $('#n-leads').textContent = estado.leads.length;
  $('#n-escaneos').textContent = estado.escaneos.length;
  $('#n-bandeja').textContent = estado.bandeja.length;

  const pendientes = estado.leads.filter((l) => l.estado === 'sin-auditar' && l.auditable).length;
  const b = $('#btn-arranque');
  b.textContent = pendientes ? 'Auditar la cartera entera (' + pendientes + ' webs)' : 'Cartera auditada';
  b.disabled = !pendientes;

  pintarTrabajo();
  ({ panel: pintarPanel, leads: pintarLeads, auditorias: pintarAuditorias, bandeja: pintarBandeja, bitacora: pintarBitacora })[pestana]();

  for (const btn of document.querySelectorAll('.principal .btn')) {
    if (btn.id !== 'btn-arranque') btn.disabled = estado.trabajo.activo;
    else btn.disabled = !pendientes || estado.trabajo.activo;
  }
}

function pintarTrabajo() {
  const t = estado.trabajo;
  const caja = $('#trabajo');
  if (!t.titulo) { caja.hidden = true; return; }
  caja.hidden = false;
  $('#trabajo-titulo').textContent = t.activo ? t.titulo + '…' : t.titulo + ' · terminado';
  caja.querySelector('.pulso').style.animationPlayState = t.activo ? 'running' : 'paused';
  caja.querySelector('.pulso').style.background = t.error ? 'var(--critico)' : t.activo ? 'var(--serie)' : 'var(--bien)';
  const reg = $('#registro');
  const abajo = reg.scrollTop + reg.clientHeight >= reg.scrollHeight - 30;
  reg.textContent = t.lineas.join('\n');
  if (abajo) reg.scrollTop = reg.scrollHeight;
}

function pintarPanel() {
  const m = estado.marcador;
  const embudo = [['En la lista', m.leads], ['Auditados', m.auditados], ['Contactados', m.contactados],
    ['Han respondido', m.respuestas], ['Clientes', m.clientes]];
  const tope = Math.max(1, ...embudo.map(([, n]) => n));

  $('#tab-panel').innerHTML = `
    <div class="fichas">
      <div class="ficha"><b>${m.clientes}</b><span>clientes pagando</span></div>
      <div class="ficha"><b>${euros(m.mrr)}</b><span>recurrente al mes</span></div>
      <div class="ficha"><b>${m.tasaRespuesta} %</b><span>responden (${m.respuestas} de ${m.contactados})</span></div>
      <div class="ficha"><b>${m.auditados}</b><span>webs auditadas</span></div>
      <div class="ficha"><b>${m.restantes}</b><span>días hasta la decisión</span></div>
    </div>

    <h2>Embudo</h2>
    <div class="tarjeta">
      ${embudo.map(([etq, n]) => `<div style="display:grid;grid-template-columns:130px 1fr 40px;align-items:center;gap:12px;margin:8px 0">
        <span class="suave mini">${etq}</span>
        <span style="height:13px;border-radius:0 4px 4px 0;background:var(--serie);width:${Math.max(2, (n / tope) * 100)}%"></span>
        <span class="suave mini" style="text-align:right">${n}</span></div>`).join('')}
    </div>

    <h2>Qué toca ahora</h2>
    ${estado.acciones.length ? estado.acciones.map((a) => `
      <div class="tarjeta accion"><div class="fila-tarjeta">
        <div><b>${esc(a.titulo)}</b><br><span class="suave mini">${esc(a.porque)}</span></div>
        <div>${botonAccion(a)}</div>
      </div></div>`).join('')
    : '<div class="vacio">Nada pendiente ahora mismo.</div>'}

    ${estado.clientes.length ? `<h2>Clientes</h2><table>
      <tr><th>Cliente</th><th>Plan</th><th>Cuota</th><th>Último escaneo</th><th></th></tr>
      ${estado.clientes.map((c) => `<tr><td><b>${esc(c.nombre)}</b></td><td class="suave">${esc(c.plan)}</td>
        <td>${euros(c.cuota)}/mes</td><td class="suave">${c.dias === null ? '—' : 'hace ' + c.dias + ' días'}</td>
        <td class="acciones"><button class="btn chico" data-vigilar="${esc(c.nombre)}">Reescanear</button></td></tr>`).join('')}
      </table>` : ''}`;
}

function botonAccion(a) {
  if (!a.herramienta) return '<span class="chip c-contactado">lo haces tú</span>';
  const args = esc(JSON.stringify(a.argumentos));
  if (a.herramienta === 'auditar_web') return `<button class="btn chico" data-auditar='${args}'>Auditar</button>`;
  if (a.herramienta === 'redactar_correo') return `<button class="btn chico" data-correo='${args}'>Escribir correo</button>`;
  if (a.herramienta === 'vigilar_cliente') return `<button class="btn chico" data-vigilar="${esc(a.argumentos.cliente)}">Reescanear</button>`;
  if (a.herramienta === 'actualizar_lead') return `<button class="btn chico peligro" data-lead='${args}'>Descartar</button>`;
  return '';
}

function pintarLeads() {
  const orden = ['respondido', 'llamada', 'cliente', 'auditado', 'contactado', 'recordado', 'sin-auditar', 'descartado'];
  const leads = [...estado.leads].sort((a, b) =>
    orden.indexOf(a.estado) - orden.indexOf(b.estado) || a.prioridad - b.prioridad || a.empresa.localeCompare(b.empresa));

  $('#tab-leads').innerHTML = `<table>
    <tr><th>Empresa</th><th>Segmento</th><th>Estado</th><th></th></tr>
    ${leads.map((l) => `<tr>
      <td><b>${esc(l.empresa)}</b><br><span class="suave mini">${esc(l.web || 'sin web anotada')}</span></td>
      <td class="suave mini">${esc(l.segmento || '')}${l.sede ? ' · ' + esc(l.sede) : ''}</td>
      <td><span class="chip c-${l.estado}">${l.estado}</span>
        ${l.diasContacto !== null ? `<br><span class="suave mini">hace ${l.diasContacto} d</span>` : ''}</td>
      <td class="acciones">
        ${l.auditable ? `<button class="btn chico" data-auditar='{"lead":"${l.id}"}'>${l.escaneos.length ? 'Reauditar' : 'Auditar'}</button>` : ''}
        ${l.escaneos.length ? `<button class="btn chico" data-correo='{"lead":"${l.id}","plantilla":"${l.plantilla}"}'>Correo</button>` : ''}
        ${!l.auditable ? `<button class="btn chico" data-web="${l.id}">Poner web</button>` : ''}
        <button class="btn chico" data-detalle="${l.id}">···</button>
      </td></tr>
      <tr id="detalle-${l.id}" hidden><td colspan="4" class="suave mini">
        <b>Por qué es buen lead:</b> ${esc(l.porQue || '—')}<br>
        <b>Vía de contacto:</b> ${esc(l.via || '—')}${l.notas ? '<br><b>Notas:</b> ' + esc(l.notas) : ''}
        <div style="margin-top:8px">Cambiar estado:
          <select data-estado="${l.id}">
            ${estado.estadosLead.map((e) => `<option value="${e}" ${e === l.estado ? 'selected' : ''}>${e}</option>`).join('')}
          </select>
        </div></td></tr>`).join('')}
  </table>`;
}

function pintarAuditorias() {
  const color = { rojo: 'var(--critico)', ambar: 'var(--aviso)', verde: 'var(--bien)' };
  const etiqueta = { rojo: 'Incumple', ambar: 'Con fallos', verde: 'Limpio' };
  if (!estado.escaneos.length) {
    $('#tab-auditorias').innerHTML = '<div class="vacio">Todavía no has auditado ninguna web. El botón verde de arriba las hace todas.</div>';
    return;
  }
  $('#tab-auditorias').innerHTML = estado.escaneos.map((e) => {
    const informes = e.informes || [];
    return `<div class="tarjeta"><div class="fila-tarjeta">
      <div>
        <b><span class="punto" style="background:${color[e.semaforo]}"></span>${esc(e.cliente)}</b>
        <span class="chip c-${e.semaforo === 'rojo' ? 'contactado' : 'auditado'}">${etiqueta[e.semaforo]}</span>
        <br><span class="suave mini">${esc(e.dominio)} · ${e.totales.paginas} páginas · ${e.totales.incidencias} incidencias ·
        ${Math.round(e.totales.minutosCorreccion / 60 * 10) / 10} h de corrección (${euros(e.totales.costeCorreccion)})
        · ${e.manual ? 'revisión manual hecha' : 'sin revisión manual'}</span>
        <div class="suave mini" style="margin-top:7px">${e.hallazgos.map((h) => esc(h.titulo) + ' (' + h.incidencias + ')').join(' · ')}</div>
      </div>
      <div style="text-align:right">
        ${informes.map((f) => `<a class="btn chico" style="text-decoration:none;display:inline-block;margin:0 0 5px 5px"
          href="/informes/${encodeURIComponent(f.archivo)}" target="_blank">${f.archivo.endsWith('.pdf') ? 'PDF' : 'Ver informe'}</a>`).join('')}
        <button class="btn chico" data-informe='{"escaneo":"${e.id}","tipo":"diagnostico"}'>Rehacer diagnóstico</button>
      </div></div></div>`;
  }).join('');
}

function pintarBandeja() {
  if (!estado.bandeja.length) {
    $('#tab-bandeja').innerHTML = '<div class="vacio">No hay correos esperando. Los prepara el programa cuando audita una web.</div>';
    return;
  }
  $('#tab-bandeja').innerHTML = estado.bandeja.map((c) => `
    <div class="tarjeta"><div class="fila-tarjeta">
      <div><b>${esc(c.empresa)}</b> <span class="chip c-auditado">${esc(c.plantilla)}</span>
        <br><span class="suave mini">${esc(c.asunto)}</span>
        <br><span class="suave mini">Mándalo por: ${esc(c.via || 'el formulario de su web')}</span></div>
      <div style="text-align:right;white-space:nowrap">
        <button class="btn chico" data-abrir="${c.id}">${abiertos.has(c.id) ? 'Cerrar' : 'Leer'}</button>
        <button class="btn chico" data-copiar="${c.id}">Copiar</button>
        <button class="btn chico fuerte" data-enviado="${c.id}">Ya lo he mandado</button>
      </div></div>
      ${abiertos.has(c.id) ? `<div class="correo">Asunto: ${esc(c.asunto)}\n\n${esc(c.cuerpo)}</div>` : ''}
    </div>`).join('');
}

function pintarBitacora() {
  if (!estado.bitacora.length) { $('#tab-bitacora').innerHTML = '<div class="vacio">Sin actividad todavía.</div>'; return; }
  $('#tab-bitacora').innerHTML = `<table><tr><th>Cuándo</th><th>Qué</th><th>Detalle</th></tr>
    ${estado.bitacora.map((e) => {
      const cuando = new Date(e.fecha).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const texto = e.texto || e.resumen || (e.nombre ? e.nombre + ' ' + JSON.stringify(e.argumentos || {}) : '');
      return `<tr><td class="suave mini">${cuando}</td><td><span class="chip c-auditado">${esc(e.tipo || '')}</span></td>
        <td class="mini">${esc(String(texto).split('\n')[0].slice(0, 130))}</td></tr>`;
    }).join('')}</table>`;
}

// ── Interacción

$('#pestanas').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  pestana = b.dataset.tab;
  for (const x of document.querySelectorAll('#pestanas button')) x.classList.toggle('activa', x === b);
  for (const s of document.querySelectorAll('main section')) s.hidden = s.id !== 'tab-' + pestana;
  pintar();
});

$('#btn-arranque').onclick = () => {
  const n = estado.leads.filter((l) => l.estado === 'sin-auditar' && l.auditable).length;
  if (!confirm(`Se van a auditar ${n} webs, una detrás de otra. Tarda entre veinte minutos y una hora.\n\nAl terminar tendrás el diagnóstico en PDF de cada una y su correo escrito en la bandeja.\n\n¿Lo lanzo?`)) return;
  pedir({ tipo: 'arranque' });
};
$('#btn-sesion').onclick = () => pedir({ tipo: 'sesion', conIA: true });
$('#btn-simulacro').onclick = () => pedir({ tipo: 'sesion', simulacro: true });
$('#btn-sembrar').onclick = () => pedir({ tipo: 'sembrar' });

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.auditar) return void pedir({ tipo: 'auditar', ...JSON.parse(d.auditar) });
  if (d.correo) return void pedir({ tipo: 'correo', ...JSON.parse(d.correo) });
  if (d.vigilar) return void pedir({ tipo: 'vigilar', cliente: d.vigilar });
  if (d.informe) return void pedir({ tipo: 'informe', ...JSON.parse(d.informe) });
  if (d.lead) {
    const args = JSON.parse(d.lead);
    if (!confirm('¿Descartar este lead? Deja de aparecer en las acciones pendientes.')) return;
    return void pedir({ tipo: 'lead', id: args.lead, estado: args.estado, nota: args.nota });
  }
  if (d.enviado) {
    if (!confirm('¿Lo has mandado ya? Esto pone el lead en "contactado" y arranca el reloj de los 7 días del recordatorio.')) return;
    abiertos.delete(d.enviado);
    return void pedir({ tipo: 'enviado', id: d.enviado });
  }
  if (d.abrir) { abiertos.has(d.abrir) ? abiertos.delete(d.abrir) : abiertos.add(d.abrir); return void pintar(); }
  if (d.copiar) {
    const c = estado.bandeja.find((x) => x.id === d.copiar);
    try { await navigator.clipboard.writeText(c.asunto + '\n\n' + c.cuerpo); avisar('Copiado. Pégalo en su formulario o en LinkedIn.'); }
    catch { avisar('El navegador no deja copiar: ábrelo con "Leer" y cópialo a mano.', true); }
    return;
  }
  if (d.detalle) {
    const f = document.getElementById('detalle-' + d.detalle);
    if (f) f.hidden = !f.hidden;
    return;
  }
  if (d.web) {
    const web = prompt('¿Cuál es su web? (por ejemplo: empresa.es)');
    if (web) pedir({ tipo: 'lead', id: d.web, web: web.trim() });
  }
});

document.addEventListener('change', (ev) => {
  const s = ev.target.closest('select[data-estado]');
  if (s) pedir({ tipo: 'lead', id: s.dataset.estado, estado: s.value });
});

// Mientras algo está en marcha se mira cada segundo; si no, cada diez.
let ultimoActivo = false;
async function latido() {
  await refrescar();
  ultimoActivo = estado?.trabajo?.activo || false;
  setTimeout(latido, ultimoActivo ? 1200 : 10000);
}
latido();
</script>
